<section class="space-y-6">
  <header class="rad-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 px-6 py-6 shadow-glow">
    <p class="text-xs uppercase tracking-[0.4em] text-blue-300/70">Admin oversight</p>
    <h2 class="text-2xl font-semibold text-slate-900 dark:text-white">Cribs enrollment and property approvals</h2>
    <div class="mt-4 grid gap-3 sm:grid-cols-2">
      <div
        class="rad border border-slate-200 dark:border-white/10 bg-white dark:bg-slate-900/70 p-4 text-sm text-slate-300">
        Pending landlord enrollments: <span class="text-slate-900 dark:text-white font-semibold">{{ pendingEnrollments()
          }}</span></div>
      <div
        class="rad border border-slate-200 dark:border-white/10 bg-white dark:bg-slate-900/70 p-4 text-sm text-slate-300">
        Properties awaiting review: <span class="text-slate-900 dark:text-white font-semibold">{{ pendingProperties()
          }}</span></div>
    </div>
  </header>
  <nav class="flex flex-wrap gap-3">
    <a *ngFor="let item of nav" [routerLink]="item.link" routerLinkActive="active"
      class="pill border border-slate-200 dark:border-white/10 px-4 py-2 text-sm text-slate-200 hover:bg-white/10">{{
      item.label }}</a>
  </nav>
  <section class="rad-lg border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 p-6 shadow-glow">
    <router-outlet></router-outlet>
  </section>
</section>
