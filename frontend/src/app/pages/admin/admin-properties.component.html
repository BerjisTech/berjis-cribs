<div class="space-y-4">
  <div class="flex flex-wrap gap-3">
    <button *ngFor="let status of statuses"
      class="pill border border-slate-200 dark:border-white/10 px-4 py-2 text-sm text-slate-200"
      [ngClass]="{ 'bg-accent-soft': selectedStatus() === status.key }" (click)="switchStatus(status.key)">{{
      status.label }}</button>
  </div>

  <div *ngIf="loading()"
    class="rad border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 p-4 text-sm text-slate-400">Loading
    properties…</div>
  <div *ngIf="!loading() && properties().length === 0"
    class="rad border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 p-4 text-sm text-slate-400">No
    properties in this state.</div>

  <article *ngFor="let property of properties()"
    class="rad border border-slate-200 dark:border-white/10 bg-white dark:bg-slate-900/70 p-5 space-y-3">
    <header class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h3 class="text-lg font-semibold text-slate-900 dark:text-white">{{ property.name }}</h3>
        <p class="text-sm text-slate-400">{{ property.description }}</p>
        <p class="text-xs text-slate-500">Landlord {{ property.landlordId }}</p>
      </div>
      <span class="pill border border-slate-200 dark:border-white/10 px-3 py-1 text-xs text-slate-300">{{
        property.status }}</span>
    </header>
    <div class="grid gap-3 md:grid-cols-2 text-xs text-slate-300">
      <div>
        <p class="text-slate-400">Location</p>
        <p>{{ property.location?.city || '—' }}</p>
      </div>
      <div>
        <p class="text-slate-400">Occupancy</p>
        <p>{{ property.details?.occupancyModes?.join(', ') || '—' }}</p>
      </div>
    </div>
    <div *ngIf="selectedStatus() === 'pending_review'"
      class="rad border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 p-4">
      <form [formGroup]="notesForm" class="grid gap-3 md:grid-cols-2">
        <textarea formControlName="notes" rows="2" class="input md:col-span-2" placeholder="Approval notes"></textarea>
        <div class="md:col-span-2 flex gap-3">
          <button type="button"
            class="pill bg-blue-600/80 px-4 py-2 text-sm font-semibold text-slate-900 dark:text-white"
            (click)="approve(property)">Approve</button>
          <div class="flex items-center gap-2">
            <input formControlName="reason" class="input" placeholder="Rejection reason" />
            <button type="button"
              class="pill bg-red-600/80 px-4 py-2 text-sm font-semibold text-slate-900 dark:text-white"
              (click)="reject(property)">Reject</button>
          </div>
        </div>
      </form>
    </div>
  </article>
</div>
