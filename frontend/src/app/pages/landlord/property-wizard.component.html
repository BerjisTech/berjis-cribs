<form [formGroup]="form" class="space-y-6">
  <!-- Wizard header / steps indicator -->
  <div class="flex items-center gap-3 text-xs">
    <span [ngClass]="{ 'font-semibold text-white': step()===0, 'text-slate-400': step()!==0 }">1. Basics</span>
    <span class="text-slate-600">→</span>
    <span [ngClass]="{ 'font-semibold text-white': step()===1, 'text-slate-400': step()!==1 }">2. Addressing</span>
    <span class="text-slate-600">→</span>
    <span [ngClass]="{ 'font-semibold text-white': step()===2, 'text-slate-400': step()!==2 }">3. Policies & Review</span>
  </div>

  <!-- Step 1: Basics -->
  <section *ngIf="step()===0" class="space-y-5">
    <div class="grid gap-4 md:grid-cols-2">
      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium text-slate-900 dark:text-slate-200">Property name</span>
        <input formControlName="name" class="input" placeholder="Berjis Suites Riverside" />
      </label>
      <label class="flex flex-col gap-2">
        <span class="text-sm font-medium text-slate-900 dark:text-slate-200">Addressing model</span>
        <select formControlName="addressType" class="input">
          <option value="simple">Simple sequential</option>
          <option value="block">Block based</option>
          <option value="floor">Floor based</option>
          <option value="hybrid">Hybrid</option>
        </select>
        <span class="text-xs text-slate-500">Choose how doors are numbered: simple (1,2,3), block (A1,B1), floor (101,102), or hybrid.</span>
      </label>
    </div>
    <label class="flex flex-col gap-2">
      <span class="text-sm font-medium text-slate-900 dark:text-slate-200">Highlights</span>
      <span class="text-xs text-slate-500">A short pitch tenants will see. Mention unique amenities and neighborhood context.</span>
      <textarea formControlName="description" rows="4" class="input" placeholder="Boutique serviced apartments in Kilimani with solar backup and concierge"></textarea>
    </label>
    <div formGroupName="address" class="grid gap-4 md:grid-cols-3">
      <label class="flex flex-col gap-2 relative">
        <span class="text-sm text-slate-900 dark:text-slate-200">City / Town</span>
        <input formControlName="city" class="input" placeholder="Nairobi"
          (input)="onCityInput($any($event.target).value)"
          (focus)="onCityFocus()" (blur)="onCityBlur()" />
        <div *ngIf="cityOpen() && (cityOptions()?.length || 0) > 0"
          class="absolute z-50 mt-20 w-full overflow-hidden rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-xl">
          <button type="button" class="block w-full px-3 py-2 text-left text-sm text-slate-800 dark:text-slate-100 hover:bg-slate-100/60 dark:hover:bg-white/10"
            *ngFor="let o of cityOptions()" (mousedown)="selectCity(o)">{{ o.label }}</button>
        </div>
      </label>
      <label class="flex flex-col gap-2">
        <span class="text-sm text-slate-900 dark:text-slate-200">Estate</span>
        <input formControlName="estate" class="input" placeholder="Kilimani" />
      </label>
      <label class="flex flex-col gap-2">
        <span class="text-sm text-slate-900 dark:text-slate-200">Street / Road</span>
        <input formControlName="street" class="input" placeholder="Arboretum Drive" />
      </label>
    </div>
    <div formGroupName="location" class="grid gap-4 md:grid-cols-2">
      <label class="flex flex-col gap-2">
        <span class="text-sm text-slate-900 dark:text-slate-200">Latitude</span>
        <input formControlName="lat" type="number" step="0.000001" class="input" placeholder="-1.2921" />
      </label>
      <label class="flex flex-col gap-2">
        <span class="text-sm text-slate-900 dark:text-slate-200">Longitude</span>
        <input formControlName="lng" type="number" step="0.000001" class="input" placeholder="36.8219" />
      </label>
    </div>
    <div class="mt-2">
      <div id="map-picker" class="h-64 w-full rounded-xl border border-slate-200 dark:border-slate-700" style="touch-action: pan-x pan-y;"></div>
      <p class="mt-2 text-xs text-slate-500">Click the map to set location. Drag the marker to fine-tune. Accurate location improves search and routing. Location is required to save a draft.</p>
      <p *ngIf="mapError()" class="mt-1 text-xs text-rose-400">{{ mapError() }}</p>
    </div>
  </section>

  <!-- Step 2: Addressing (own section due to space) -->
  <section *ngIf="step()===1" class="space-y-5" formGroupName="numbering">
    <app-numbering-editor [group]="$any(form.get('numbering'))"></app-numbering-editor>
  </section>

  <!-- Step 3: Policies & Review -->
  <section *ngIf="step()===2" class="space-y-5">
    <div formGroupName="details" class="grid gap-4">
      <label class="flex flex-col gap-2">
        <span class="text-sm text-slate-900 dark:text-slate-200">Occupancy mode</span>
        <span class="text-xs text-slate-500">Select the primary lease type for this property.</span>
        <select formControlName="occupancyMode" class="input">
          <option value="hourly">Hourly</option>
          <option value="nightly">Nightly (5pm–10am)</option>
          <option value="daily">Day (24hrs)</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </label>

      <div class="grid gap-2 md:grid-cols-2">
        <label class="flex flex-col gap-2">
          <span class="text-sm text-slate-900 dark:text-slate-200">Base rate amount</span>
          <input formControlName="baseRateAmount" type="number" min="0" class="input" placeholder="e.g., 6500" />
        </label>
        <label class="flex flex-col gap-2">
          <span class="text-sm text-slate-900 dark:text-slate-200">Base rate duration</span>
          <select formControlName="baseRateFrequency" class="input">
            <option value="hourly">Hour</option>
            <option value="nightly">Night</option>
            <option value="daily">Day</option>
            <option value="weekly">Week</option>
            <option value="monthly">Month</option>
            <option value="yearly">Year</option>
          </select>
        </label>
      </div>

      <div class="flex flex-col gap-2">
        <span class="text-sm text-slate-900 dark:text-slate-200">Amenities</span>
        <span class="text-xs text-slate-500">Check all that apply.</span>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
          <label *ngFor="let a of knownAmenities" class="flex items-center gap-2 text-sm">
            <input type="checkbox" [value]="a"
              (change)="toggleAmenity(a, $event.target.checked)"
              [checked]="(form.get('details.amenities')?.value||[]).includes(a)" />
            <span>{{ a }}</span>
          </label>
        </div>
      </div>
    </div>

    <div formGroupName="policies" class="grid gap-4 md:grid-cols-2">
      <label class="flex flex-col gap-2">
        <span class="text-sm text-slate-900 dark:text-slate-200">Cancellation policy</span>
        <textarea formControlName="cancellation" rows="3" class="input" placeholder="Flexible up to 7 days; 50% thereafter"></textarea>
      </label>
      <label class="flex flex-col gap-2">
        <span class="text-sm text-slate-900 dark:text-slate-200">House rules</span>
        <textarea formControlName="houseRules" rows="3" class="input" placeholder="No smoking indoors; quiet hours 10pm–6am"></textarea>
      </label>
    </div>
  </section>

  <!-- Footer actions -->
  <div class="flex items-center justify-between pt-2">
    <div class="flex gap-2">
      <button type="button" class="pill border px-4 py-2 text-sm" (click)="prev()" [disabled]="step()===0">Back</button>
      <button type="button" class="pill border px-4 py-2 text-sm" (click)="next()" [disabled]="step()===2">Next</button>
    </div>
    <button *ngIf="isEditing" type="button" class="pill border border-rose-400/30 text-rose-400 px-4 py-2 text-sm" (click)="deleteProperty()">Delete property</button>
    <div class="flex gap-2">
      <button type="button" class="pill px-5 py-2 text-sm font-semibold text-white bg-slate-700/80" (click)="create(true)" [disabled]="!canSaveDraft">{{ saving() ? 'Saving…' : 'Save draft' }}</button>
      <button *ngIf="step()===2" type="button" class="pill bg-blue-600/80 px-5 py-2 text-sm font-semibold text-white shadow-lg shadow-blue-900/40" (click)="create(false)" [disabled]="saving()">Create</button>
    </div>
  </div>
  <p *ngIf="error()" class="text-sm text-red-300">{{ error() }}</p>
</form>
