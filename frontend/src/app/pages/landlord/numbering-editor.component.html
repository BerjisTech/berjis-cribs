<ng-container *ngIf="group as g">
<!-- Checkboxes -->
<div class="grid gap-2 md:grid-cols-3" [formGroup]="g">
  <label class="flex items-center gap-2" *ngIf="g.get('hasBlocks')">
    <input type="checkbox" formControlName="hasBlocks" />
    <span class="text-xs text-slate-500">Do you have blocks?</span>
  </label>
  <label class="flex items-center gap-2" *ngIf="g.get('hasPhases') && (val?.hasBlocks)">
    <input type="checkbox" formControlName="hasPhases" />
    <span class="text-xs text-slate-500">Do the blocks have phases/sides?</span>
  </label>
  <label class="flex items-center gap-2" *ngIf="g.get('includeGround')">
    <input type="checkbox" formControlName="includeGround" />
    <span class="text-xs text-slate-500">Ground floor is "G"</span>
  </label>
</div>

<!-- Dropdowns -->
<div class="grid gap-3 md:grid-cols-3 mt-2" [formGroup]="g">
  <label class="flex flex-col gap-1" *ngIf="showAddressing && g.get('addressType')">
    <span class="text-xs text-slate-500">Addressing</span>
    <select formControlName="addressType" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option value="simple">Simple</option>
      <option value="block">Block</option>
      <option value="floor">Floor</option>
      <option value="hybrid">Hybrid</option>
      <option value="standalone">Standalone</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="g.get('blockNaming') && val?.hasBlocks">
    <span class="text-xs text-slate-500">Choose how you label your blocks</span>
    <select formControlName="blockNaming" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option value="letters">Letters (A, B, C.)</option>
      <option value="numbers">Numbers (1, 2, 3.)</option>
      <option value="custom">Custom prefix</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="val?.hasBlocks && val?.blockNaming==='numbers' && g.get('blockDigits')">
    <span class="text-xs text-slate-500">Block number digits</span>
    <select formControlName="blockDigits" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option [value]="1">1</option>
      <option [value]="2">2</option>
      <option [value]="3">3</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="val?.hasPhases && g.get('phaseNaming')">
    <span class="text-xs text-slate-500">Choose how you label your blocks' phases</span>
    <select formControlName="phaseNaming" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option value="letters">Letters (A, B)</option>
      <option value="numbers">Numbers (1, 2)</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="val?.hasPhases && val?.phaseNaming==='numbers' && g.get('phaseDigits')">
    <span class="text-xs text-slate-500">Phase number digits</span>
    <select formControlName="phaseDigits" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option [value]="1">1</option>
      <option [value]="2">2</option>
      <option [value]="3">3</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="g.get('floorLabelKind')">
    <span class="text-xs text-slate-500">Choose how you label your floors</span>
    <select formControlName="floorLabelKind" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option value="numeric">Numeric (1, 2, 3)</option>
      <option value="alpha">Alphabetic (A, B, C)</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="val?.floorLabelKind==='numeric' && g.get('floorDigits')">
    <span class="text-xs text-slate-500">Floor number digits</span>
    <select formControlName="floorDigits" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option [value]="1">1</option>
      <option [value]="2">2</option>
      <option [value]="3">3</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="g.get('floorDoorKind') && (val?.labelingMode||'floor')==='floor'">
    <span class="text-xs text-slate-500">On each floor, label doors with</span>
    <select formControlName="floorDoorKind" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option value="numeric">Numeric (.01, .02)</option>
      <option value="alpha">Alphabetic (.A, .B)</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="g.get('doorScheme')">
    <span class="text-xs text-slate-500">Door number system</span>
    <select formControlName="doorScheme" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option value="simple_numeric">Simple numeric (1..n across floors)</option>
      <option value="simple_alpha">Simple alphabetic (A..Z, AA..)</option>
      <option value="floor_numeric">Floor-based numeric (G1, 101..)</option>
      <option value="floor_alpha">Floor-based alphabetic (G A, 1A, 1B..)</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="(val?.doorScheme==='simple_numeric' || val?.doorScheme==='floor_numeric') && g.get('doorDigits')">
    <span class="text-xs text-slate-500">Door number digits</span>
    <select formControlName="doorDigits" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option [value]="1">1</option>
      <option [value]="2">2</option>
      <option [value]="3">3</option>
    </select>
  </label>
  <label class="flex flex-col gap-1" *ngIf="g.get('groundStyle')">
    <span class="text-xs text-slate-500">Ground floor style</span>
    <select formControlName="groundStyle" class="input bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-700">
      <option value="g">g1, g2.</option>
      <option value="00">001, 002.</option>
    </select>
  </label>
</div>

<!-- Numbers: blocks → phases → floors → units -->
<div class="grid gap-3 md:grid-cols-4 mt-2" [formGroup]="g">
  <label class="flex flex-col gap-1 md:col-span-1" *ngIf="val?.hasBlocks && g.get('blocksCount')">
    <span class="text-xs text-slate-500">How many blocks do you have?</span>
    <input formControlName="blocksCount" type="number" min="1" class="input" />
  </label>
  <label class="flex flex-col gap-1 md:col-span-1" *ngIf="val?.hasPhases && g.get('phaseSides')">
    <span class="text-xs text-slate-500">How many phases/sides per block?</span>
    <input formControlName="phaseSides" type="number" min="1" class="input" />
  </label>
  <label class="flex flex-col gap-1 md:col-span-1" *ngIf="g.get('floors')">
    <span class="text-xs text-slate-500">How many floors?</span>
    <input formControlName="floors" type="number" min="0" class="input" />
  </label>
  <label class="flex flex-col gap-1 md:col-span-1" *ngIf="g.get('unitsPerFloor')">
    <span class="text-xs text-slate-500">How many units per floor?</span>
    <input formControlName="unitsPerFloor" type="number" min="1" class="input" />
  </label>
</div>

<!-- Overrides -->
<div class="grid gap-3 md:grid-cols-3 mt-2" [formGroup]="g">
  <label class="flex flex-col gap-1" *ngIf="val?.hasBlocks && g.get('blockLabels')">
    <span class="text-xs text-slate-500">Block labels (CSV override)</span>
    <input formControlName="blockLabels" class="input" placeholder="G,H,J,47,48" />
  </label>
  <label class="flex flex-col gap-1" *ngIf="val?.hasBlocks && g.get('blockNaming')?.value==='custom' && g.get('blockPrefix')">
    <span class="text-xs text-slate-500">Custom block prefix</span>
    <input formControlName="blockPrefix" class="input" placeholder="Block" />
  </label>
  <label class="flex flex-col gap-1" *ngIf="val?.hasPhases && g.get('phasesList')">
    <span class="text-xs text-slate-500">Phases/Sides (CSV)</span>
    <input formControlName="phasesList" class="input" placeholder="1,2,3,4 or A,B" />
  </label>
</div>
<!-- end ngIf group -->
</ng-container>

<!-- Live preview -->
<div class="space-y-4 mt-3">
  <p class="text-xs text-slate-500">Preview updates in real time.</p>
  <div class="grid gap-5 md:grid-cols-2" *ngIf="previewBlocks.length > 0">
    <div *ngFor="let block of previewBlocks" class="rad border border-slate-200 dark:border-slate-700 bg-white/5 p-3">
      <div class="mb-2 flex items-center justify-between">
        <span class="text-sm font-semibold text-slate-200" *ngIf="block.label">Block {{ block.label }}</span>
        <span class="text-xs text-slate-500" *ngIf="!block.label">Single building</span>
      </div>
      <table class="w-full text-xs">
        <thead>
          <tr>
            <th class="text-left text-slate-400">Floor</th>
            <ng-container *ngIf="!block.sides; else sidedHead">
              <th class="text-left text-slate-400" *ngFor="let _ of unitSlots">Unit</th>
            </ng-container>
            <ng-template #sidedHead>
              <th *ngFor="let s of block.sides" class="text-left text-slate-400">{{ block.label ? (block.label + s) : s }}</th>
            </ng-template>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of block.floors">
            <td class="py-1 pr-2 text-slate-400">{{ f.label }}</td>
            <ng-container *ngIf="!block.sides; else sidedCells">
              <td class="py-1" *ngFor="let cell of f.cells">
                <span class="inline-flex rounded-md border border-slate-700/60 bg-slate-900/60 px-2 py-1">{{ cell }}</span>
              </td>
            </ng-container>
            <ng-template #sidedCells>
              <td class="py-1" *ngFor="let side of f.cells">
                <div class="flex flex-wrap gap-1">
                  <span *ngFor="let cell of side" class="inline-flex rounded-md border border-slate-700/60 bg-slate-900/60 px-2 py-1">{{ cell }}</span>
                </div>
              </td>
            </ng-template>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
